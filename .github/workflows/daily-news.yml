name: Daily IP News Collection

on:
  schedule:
    - cron: "21 21 * * *"   # 매일 06:21 KST
    - cron: "21 1 * * *"    # 매일 10:21 KST
    - cron: "21 3 * * *"    # 테스트용 12:21 KST
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests feedparser anthropic

      - name: Collect & classify news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python collector/collect_news.py

      - name: Commit updated archive
        run: |
          git config user.name "kiip-radar-bot"
          git config user.email "actions@github.com"
          git add data/news.json
          git diff --cached --quiet || git commit -m "chore: daily news update $(date +'%Y-%m-%d')"
          git push
